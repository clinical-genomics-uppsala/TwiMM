---
output: "config/output_files.yaml"
resources: "config/resources.yaml"
samples: "config/samples_T.tsv"
units: "config/units_T.tsv"

default_container: "docker://hydragenetics/common:4.0.0"
pipeline_version: "v1.8.0"

module_versions:
  alignment: "develop"
  annotation: "v1.2.0"
  cnv_sv: "develop"
  filtering: "v1.1.0"
  prealignment: "v1.4.0"
  reports: "f5ff8bde067a4d10c81eb021c685fa75ef34d541" # last change compatible with this pipeline before v0.11.0
  snv_indels: "v2.0.0"
  qc: "v0.7.0"

reference:
  fasta: "../ref_data/GCA_000001405.15_GRCh38_no_alt_analysis_set.fasta"
  fai: "../ref_data/GCA_000001405.15_GRCh38_no_alt_analysis_set.fasta.fai"
  trf: &trf "../ref_data/human_GRCh38_no_alt_analysis_set.trf.bed"
  design_bed: &design_bed "../ref_data/Myelom_expected_capture_targets_annotated_v2.bed"
  design_intervals: "../ref_data/expected_capture_targets_covered_v2.interval_list"
  panel_full_genes: &panel_full_genes "../ref_data/panel_full_genes.bed"
  cnv_pon: &cnv_pon "../build_pon/results/cnvkit_build_normal_reference/cnvkit.PoN.cnn"
  # sv_pon: "../build_pon/results/bcftools_merge/sv_normal.vcf.gz"
  sv_gnomad: "/data/ref_genomes/GNOMAD/gnomad_v2.1_sv.sites.vcf.gz"
  severus_pon: &severus_pon "../ref_data/PoN_1000G_hg38.tsv.gz"
  snv_pon: &snv_pon "../build_pon/results/bcftools_merge/snv_normal.vcf.gz"

aligner: "vacmap"
phaser: "whatshap"

annotate_cnv:
  tag: "germline"
  germline: *panel_full_genes

bcftools_filter_include_region:
  panel: *design_bed

bcftools_view:
  extra: ""

caller: "cnvkit"

clairs_to_call:
  container: "docker://hkubal/clairs-to:latest"
  extra: ""
  platform: "hifi_revio"

cnv_html_report:
  show_table: true
  cytobands: false

cnvkit_batch:
  container: "docker://hydragenetics/cnvkit:0.9.11"
  normal_reference: *cnv_pon
  method: "hybrid"

cnvkit_call:
  container: "docker://hydragenetics/cnvkit:0.9.11"
  extra: ""
  purity: 0.9

cnvkit_vcf:
  container: "docker://hydragenetics/cnvkit:0.9.9"
  extra: ""

compile_xlsx_report:
  filters: "config/filters/config_vcf_report.yaml"
  genes: *panel_full_genes

deepsomatic_t_only:
  container: "docker://google/deepsomatic:1.9.0"
  model: "PACBIO"
  pon: *snv_pon
  extra: ""

filter_vcf:
  germline: "config/filters/config_hard_filter_germline_vep.yaml"

general_report: "config/report.yaml"

merge_cnv_json:
  germline_vcf: "snv_indels/whatshap_phase/{sample}_T.phased.include.panel.vep_annotated.filter.germline.bcftools_view.germline.vcf.gz"
  unfiltered_cnv_vcfs:
    - "cnv_sv/cnvkit_vcf/{sample}_T.pathology.annotate_cnv.germline.vcf.gz"
  filtered_cnv_vcfs:
    - "cnv_sv/cnvkit_vcf/{sample}_T.pathology.annotate_cnv.germline.vcf.gz"
  annotations:
    - *design_bed

mosdepth:
  container: "docker://hydragenetics/mosdepth:0.3.6"
  by: *design_bed
  extra: ""

multiqc:
  container: "docker://hydragenetics/multiqc:1.25.1"
  reports:
    DNA:
      included_unit_types: 
        - "T"
        - "N"
      qc_files:
        - "qc/sequali/{sample}_{type}_{processing_unit}_{barcode}.json"
        - "qc/mosdepth/{sample}_{type}.mosdepth.global.dist.txt"
        - "qc/mosdepth/{sample}_{type}.mosdepth.region.dist.txt"
        - "qc/mosdepth/{sample}_{type}.mosdepth.summary.txt"
        - "qc/picard_collect_alignment_summary_metrics/{sample}_{type}.alignment_summary_metrics.txt"
        - "qc/picard_collect_hs_metrics/{sample}_{type}.HsMetrics.txt"

pbmarkdup:
  container: "docker://hydragenetics/pbmarkdup:1.1.0"
  extra: " --ignore-read-names"

pbmm2_index:
  container: "docker://hydragenetics/pbmm2:1.16"
  preset: "HIFI"
  extra: ""

pbmm2_align:
  container: "docker://hydragenetics/pbmm2:1.16"
  preset: "HIFI"
  extra: ""

pbmm2_merge:
  container: "docker://hydragenetics/pbmm2:1.16"

pbsv_discover:
  container: "docker://hydragenetics/pbsv:2.9.0"
  trf: *trf
  extra: ""

pbsv_call:
  container: "docker://hydragenetics/pbsv:2.9.0"
  extra: ""

picard_collect_alignment_summary_metrics:
  container: "docker://hydragenetics/picard:2.25.4"
  extra: ""

picard_collect_hs_metrics:
  container: "docker://hydragenetics/picard:2.25.4"
  extra: ""

sequali:
  container: "docker://hydragenetics/sequali:0.12.0"
  extra: ""

severus_t_only:
  container: "docker://hydragenetics/severus:1.5"
  vntr: *trf
  pon: *severus_pon
  extra: ""

sniffles2_call:
  container: "docker://hydragenetics/sniffles2:2.6.1"
  extra: "--phase"

svdb_merge:
  tc_method:
    - name: pathology
      sv_caller:
        - caller: severus
          vcf: "cnv_sv/severus_t_only/{sample}_T_all_sv.include.panel.vcf.gz"
        - caller: pbsv
          vcf: "cnv_sv/pbsv_call/{sample}_T.include.panel.vcf.gz"
        - caller: sniffles2
          vcf: "cnv_sv/sniffles2_call/{sample}_T.include.panel.vcf.gz"
      cnv_caller:
        - cnvkit
      priority: severus,sniffles2,pbsv
  container: "docker://hydragenetics/svdb:2.6.0"

svdb_query:
  db_string: "" # this string is created by a helper function
  container: "docker://hydragenetics/svdb:2.6.0"
  extra: "--out_occ GNOMAD_AC --out_frq GNOMAD_AF --out_frq AF --in_occ AN --in_frq AF"

trimmer_software: "None"

use_deepsomatic: false

vacmap_align:
  mode: "L"
  container: "docker://hydragenetics/vacmap:1.0.0"

vep:
  container: "docker://hydragenetics/vep:113.0"
  vep_cache: "/data/ref_genomes/VEP"
  mode: "--offline --cache "
  extra: " --assembly GRCh38 --pick --cache_version 110 --variant_class --refseq --protein --hgvs --fasta {fasta}"

whatshap_phase:
  container: "docker://hydragenetics/whatshap:2.2"
  extra: " --ignore-read-groups"

whatshap_haplotag:
  container: "docker://hydragenetics/whatshap:2.2"
  extra: " --ignore-read-groups --skip-missing-contigs"
