[workspace]
authors = ["Andrei Guliaev <andrei.guliaev@scilifelab.uu.se>"]
channels = ["bioconda", "conda-forge"]
name = "TwiMM"
platforms = ["linux-64"]
version = "1.4.0"

[tasks]
pre-commit = "PYTHONPATH=. pre-commit run pytest-check --all-files"
tests = "PYTHONPATH=. pytest .tests/unit/"
pc-snakefmt = "pre-commit run snakefmt"
snakefmt = "snakefmt -l 130 workflow/Snakefile"
dry = "snakemake --configfile config/config.yaml -n --cores 1"
full = "snakemake --configfile config/config.yaml --profile profiles/marvin_cpu"
rulegraph_cl = "snakemake --configfile config/config.yaml --rulegraph | dot -Tsvg > images/rulegraph_clairs.svg"
rulegraph_ds = "snakemake --configfile config/config.yaml --rulegraph | dot -Tsvg > images/rulegraph_deepsomatic.svg"

[dependencies]
python = "==3.10"
pycodestyle = ">=2.14.0,<3"
pytest = ">=8.4.1,<9"
snakefmt = ">=0.11.0,<0.12"
pre-commit = ">=4.3.0,<5"
pytest-cov = ">=6.2.1,<7"
pandas = ">=2.3.1,<3"
pulp = "<2.8"
drmaa = "==0.7.9"
tabulate = ">=0.9.0,<0.10"

[pypi-dependencies]
hydra-genetics = ">=3.3.0, <4"
